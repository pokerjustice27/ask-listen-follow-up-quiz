<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ask, Listen and Follow Up</title><style>
:root{--cream:#f7f2e8;--green:#173f35;--orange:#e6a35b;--ink:#24352f}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}.page{min-height:100vh;position:relative;overflow:hidden;padding:42px 20px}.orb{position:fixed;border-radius:50%;opacity:.6}.o1{width:320px;height:320px;background:#dfe9d8;top:-130px;right:-90px}.o2{width:260px;height:260px;background:#f1dcc1;bottom:-130px;left:-70px}.wrap{position:relative;width:min(100%,800px);margin:auto}.head{display:flex;align-items:center;gap:18px;margin-bottom:24px}.logo{width:58px;height:58px;flex:none;display:grid;place-items:center;border-radius:17px;background:var(--green);color:#fff;font-weight:800;box-shadow:0 10px 24px #173f3526}.eyebrow{margin:0 0 5px;color:#567468;font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase}h1{margin:0;color:var(--green);font-family:Georgia,serif;font-size:clamp(30px,5vw,46px);line-height:1.05}.sub{margin:7px 0 0;color:#5c6b66}.instruction{padding:14px 18px;border:1px solid #cadacb;border-radius:14px;background:#edf3eccc;color:#355247;line-height:1.5}.prow{display:flex;justify-content:space-between;margin:20px 3px 8px;color:#607069;font-size:13px;font-weight:700}.track{height:7px;border-radius:99px;background:#d9ded7;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#53806c,#7da089);transition:width .35s}.card{margin-top:18px;padding:clamp(24px,5vw,42px);border:1px solid #e1d9cc;border-radius:24px;background:#fffdf9;box-shadow:0 18px 55px #5d523b17}.pill{display:inline-flex;padding:7px 11px;border-radius:99px;background:#f3dfc8;color:#815424;font-size:12px;font-weight:850;letter-spacing:.09em}.situation{margin:20px 0 8px;color:#53625d;font-size:17px;line-height:1.55}.card h2{color:var(--green);font-family:Georgia,serif;margin:0 0 23px;font-size:clamp(23px,4vw,31px);line-height:1.2}.answers{display:grid;gap:12px}.answer{width:100%;display:flex;align-items:center;gap:14px;padding:15px 16px;border:1.5px solid #d7d8d1;border-radius:14px;background:white;color:#273a33;text-align:left;line-height:1.4;cursor:pointer}.answer:hover:not(:disabled),.answer:focus-visible{transform:translateY(-1px);border-color:#6e9581;outline:none}.answer:disabled{cursor:default;opacity:.68}.answer.correct{border-color:#4b8065;background:#eaf3ec;opacity:1}.answer.incorrect{border-color:#c98145;background:#fff2e7}.letter{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:10px;background:#edf0eb;color:var(--green);font-weight:850}.correct .letter{background:#4b8065;color:#fff}.incorrect .letter{background:#d18c52;color:#fff}.feedback{display:flex;gap:12px;margin-top:18px;padding:15px 17px;border-radius:14px;line-height:1.5;font-weight:600}.good{background:#e1efe5;color:#285840}.retry{background:#fff0df;color:#794a22}.icon{width:25px;height:25px;display:grid;place-items:center;flex:none;border:1px solid;border-radius:50%;font-weight:900}.action{margin-top:22px;border:0;border-radius:13px;background:var(--green);color:white;padding:14px 21px;font-weight:800;cursor:pointer}.complete{text-align:center;padding-block:clamp(38px,8vw,64px)}.tick{width:66px;height:66px;margin:0 auto 22px;display:grid;place-items:center;border-radius:50%;background:#dceade;color:#2b654a;font-size:32px;font-weight:900}.complete h2{margin:5px 0 12px;font-size:clamp(38px,7vw,56px)}.process{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:9px;margin:15px auto 24px;color:var(--green);font-size:14px;font-weight:900}.process span{padding:9px 11px;border-radius:9px;background:#e7efe7}.process b{color:var(--orange);font-size:19px}.reminder{max-width:620px;margin:auto;color:#4d5f58;font-size:17px;line-height:1.65}@media(max-width:560px){.page{padding:24px 14px}.head{align-items:flex-start}.logo{width:48px;height:48px}.card{padding:22px 17px}.answer{align-items:flex-start;padding:13px}.action{width:100%}.process{gap:6px}.process span{padding:8px;font-size:12px}}
</style></head><body><main class="page"><div class="orb o1"></div><div class="orb o2"></div><section class="wrap" aria-live="polite"><header class="head"><div class="logo">AL</div><div><p class="eyebrow">Business conversation skills</p><h1>Ask, Listen and Follow Up</h1><p class="sub">Choose the best response in each situation.</p></div></header><div id="app"></div></section></main><script>
const qs=[
{stage:'ASK',s:'You meet a new business contact.',q:'Which question is the best way to start?',a:['Do you need more customers?','What would you most like to improve in your business?','Is your business going well?'],c:1,yes:'Correct! This is an open question. It invites the client to explain.',no:'Try again. This question may only get a short yes or no answer. Choose a question that invites the client to explain more.'},
{stage:'LISTEN AND FOLLOW UP',s:'The client says: “We get enough enquiries, but sometimes it takes two days to reply.”',q:'What is the best follow-up question?',a:['How is the two-day delay affecting your clients?','Do you have a big office?','Are your staff friendly?'],c:0,yes:'Correct! You listened for a useful detail — the two-day delay — and followed up on it.',no:'Try again. Choose a question that connects directly to what the client just said.'},
{stage:'KEEP IT NEUTRAL',s:'The client says: “Our team is very busy at the moment.”',q:'Which is the best question?',a:['Why is your team so badly organised?','Do you need more staff?','What is keeping your team busy at the moment?'],c:2,yes:'Correct! This question is open, neutral and relevant.',no:'Try again. Choose a question that does not assume there is already a problem or solution.'},
{stage:'SUMMARISE',s:'The client says: “Because we reply late, some customers contact another company.”',q:'What is the best response?',a:['You need a new system.','So the slow response may be causing you to lose some customers. Have I understood that correctly?','Do you want to buy new software?'],c:1,yes:'Correct! You summarised the key point and checked your understanding.',no:'Try again. Do not jump straight to a solution. First check that you understood the client correctly.'}];
let i=0,sel=null,done=false;const app=document.querySelector('#app');function esc(x){return x.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}function render(){if(done){app.innerHTML=`<article class="card complete"><div class="tick">✓</div><p class="eyebrow">Activity complete</p><h2>Great work!</h2><p>You used the full process:</p><div class="process"><span>ASK</span><b>→</b><span>LISTEN</span><b>→</b><span>FOLLOW UP</span><b>→</b><span>SUMMARISE</span></div><p class="reminder">Remember: good questions are open, neutral and relevant. Listen to the answer and let it guide your next question.</p><button class="action" onclick="restart()">Try Again</button></article>`;return}const x=qs[i],right=sel===x.c;app.innerHTML=`<div class="instruction">Read each situation and choose the best answer. You will get feedback straight away.</div><div class="prow"><span>Question ${i+1} of 4</span><span>${(i+1)*25}%</span></div><div class="track"><div class="fill" style="width:${(i+1)*25}%"></div></div><article class="card"><div class="pill">${x.stage}</div><p class="situation">${x.s}</p><h2>${x.q}</h2><div class="answers" role="group">${x.a.map((a,n)=>`<button class="answer ${sel===n?(n===x.c?'correct':'incorrect'):''}" onclick="choose(${n})" ${right?'disabled':''}><span class="letter">${String.fromCharCode(65+n)}</span><span>${esc(a)}</span></button>`).join('')}</div>${sel===null?'':`<div class="feedback ${right?'good':'retry'}" role="status"><span class="icon">${right?'✓':'↻'}</span><span>${right?x.yes:x.no}</span></div>`}${right?`<button class="action" onclick="next()">${i===3?'Finish Activity':'Next Question'} →</button>`:''}</article>`}function choose(n){if(sel!==qs[i].c){sel=n;render()}}function next(){if(i===3)done=true;else{i++;sel=null}render()}function restart(){i=0;sel=null;done=false;render()}render();
</script></body></html>
